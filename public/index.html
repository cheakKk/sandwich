<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandwich</title>
<style>
  body { font: 16px/1.4 Georgia, serif; background: #f2e6c9; color: #1b1b1b; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  #log { flex: 1; overflow: auto; padding: 16px; }
  .ev { margin: 0 0 10px; white-space: pre-wrap; }
  .ev b { background: #e8412c; color: #fff; padding: 0 6px; margin-right: 8px; }
  .ev.agent b { background: #1b1b1b; }
  .ev.system b { background: #7a7a7a; }
  .ask { border: 3px solid #e8412c; padding: 8px; margin: 0 0 10px; }
  #status { min-height: 1.4em; padding: 0 16px; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; background: #1b1b1b; }
  input { font: inherit; padding: 8px; border: 0; }
  #text { flex: 1; }
  button { font: inherit; background: #e8412c; color: #fff; border: 0; padding: 8px 16px; cursor: pointer; }
</style>
<div id="log"></div>
<div id="status"></div>
<form id="f"><input id="text" placeholder="steer the agent, or /help" autofocus><button>Send</button></form>
<script>
  const log = document.getElementById('log');
  const me = localStorage.getItem('u') || prompt('Your name') || 'guest';
  localStorage.setItem('u', me);
  let ws;
  const connect = () => {
    // re-read the hash each time: after an invite is redeemed it holds our own session token
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?t=' + encodeURIComponent(location.hash.slice(1)) + '&n=' + encodeURIComponent(me));
    ws.onopen = () => { log.textContent = ''; for (const k in asks) delete asks[k]; }; // the server replays history on every connect
    ws.onclose = (e) => {
      if (e.code === 4401) { log.textContent = 'Sandwich is invite only. Invite links work once and expire. Ask the owner for a new one.'; }
      else if (e.code === 4403 || e.code === 4408) { log.textContent = e.reason || (e.code === 4408 ? 'Too many tabs open.' : 'You were removed from this session.'); }
      else { document.getElementById('status').textContent = 'connection lost, reconnecting...'; setTimeout(connect, 2000); }
    };
    ws.onmessage = onMessage;
  };
  const add = (el) => { log.append(el); log.scrollTop = log.scrollHeight; };
  const asks = {}, typers = {};
  let busy = false, role = '', mode = '';
  const setTitle = () => { document.title = 'Sandwich (' + role + (mode ? ', ' + mode : '') + ')'; };
  const showStatus = () => {
    const who = Object.keys(typers).filter((n) => typers[n] > Date.now());
    document.getElementById('status').textContent = [busy && 'agent is working', who.length && who.join(', ') + (who.length > 1 ? ' are' : ' is') + ' typing'].filter(Boolean).join(' · ');
  };
  let lastTyped = 0;
  text.oninput = () => { if (ws.readyState === 1 && Date.now() - lastTyped > 1500) { lastTyped = Date.now(); ws.send(JSON.stringify({ type: 'typing' })); } };
  const onMessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'status') { busy = m.busy; showStatus(); }
    else if (m.type === 'typing') {
      typers[m.name] = Date.now() + 3000; showStatus(); setTimeout(showStatus, 3100);
    } else if (m.type === 'role') { role = m.role; setTitle(); }
    else if (m.type === 'mode') { mode = m.mode; setTitle(); }
    else if (m.type === 'session') history.replaceState(null, '', '#' + m.token); // the invite is burned; keep our own session so refresh works
    else if (m.type === 'approval') {
      const d = document.createElement('div'); d.className = 'ask'; asks[m.id] = d;
      const full = document.createElement('pre'); // the whole input, never cut: the harmful part can sit after a long harmless prefix
      full.style.cssText = 'max-height:14em;overflow:auto;white-space:pre-wrap;margin:6px 0';
      full.textContent = JSON.stringify(m.input, null, 2);
      d.append('Agent wants to use ' + m.tool + ':', full);
      for (const ok of [true, false]) {
        const b = document.createElement('button'); b.textContent = ok ? 'Allow' : 'Deny';
        b.onclick = () => ws.send(JSON.stringify({ type: 'decide', id: m.id, allow: ok }));
        d.append(b);
      }
      add(d);
    } else if (m.type === 'resolved') { asks[m.id]?.remove(); }
    else if (m.user) { // chat events only; unknown message types are ignored instead of shown as junk
      const d = document.createElement('div'); d.className = 'ev ' + m.user;
      const b = document.createElement('b'); b.textContent = m.user;
      d.append(b, m.text); add(d);
    }
  };
  f.onsubmit = (e) => {
    e.preventDefault();
    if (ws.readyState !== 1) return; // keep what they typed until we are connected again
    ws.send(JSON.stringify({ text: text.value })); text.value = '';
  };
  connect();
</script>
